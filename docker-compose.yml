version: '3.8'

services:
  db:
    image: postgres:15
    container_name: banking_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 57206700
      POSTGRES_DB: bank_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: testbankingsystem_app
    environment:
      DB_URL: jdbc:postgresql://db:5432/bank_db
      DB_USERNAME: postgres
      DB_PASSWORD: 57206700
    depends_on:
      - db
    ports:
      - "8082:8082"

volumes:
  pgdata:
